[workspace]
members = ["sailfish-minify-core"]
resolver = "2"

[package]
name = "sailfish-minify"
version = "0.11.1"
authors = ["Abrudan Paul - Andrei <paulandreiabrudan@proton.me>"]
description = "Hacky but simple minification support for sailfish, using html-minifier by default"
homepage = "https://github.com/pauldotsh/sailfish-minify"
repository = "https://github.com/pauldotsh/sailfish-minify"
keywords = ["minification", "html", "sailfish"]
categories = ["template-engine"]
license = "MIT"
edition = "2024"
exclude = ["sailfish-minify-core"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sailfish_minify"
proc-macro = true
test = true
doctest = false

[features]
default = ["minify-components", "native-minifier"]
minify-components = []
native-minifier = ["dep:minify-html"]
# `regex` is used to extract `<% include!(...) %>` paths from template source.
# Off by default: the dependency-free manual parser is faster and keeps the
# dependency tree small. Enable only if you need the regex-based behavior.
regex = ["dep:regex"]

[dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
regex = { version = "1.13.1", optional = true }
rayon = "1.12.0"
pathdiff = "0.2.3"
minify-html = { version = "0.18.1", optional = true }


[dependencies.sailfish-compiler]
version = "0.11.3"
default-features = false
features = ["procmacro"]

[dev-dependencies]
sailfish = "0.11.3"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
